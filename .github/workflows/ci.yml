name: Cartridge App

on:
  push:
    branches-ignore:
      - "no-ga/**"
  pull_request:
    branches-ignore:
      - "no-ga/**"


permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  functional_test:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: "lukassgx/arm-gcc"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate --copies
        pip install -e "."

    - name: Tests
      run: ./tests/tester.sh
      timeout-minutes: 2

    # - name: Test with pytest
    #   run: |
    #     pytest

  open_pull_request:
      if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
      needs:
        - functional_test
      runs-on: ubuntu-latest
      permissions:
        pull-requests: write
        contents: read
      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
  
        - name: Get body content
          id: pr_body
          run: |
            echo "COMMITS_LIST<<EOF" >> $GITHUB_ENV
            echo "### List of changements: " >> $GITHUB_ENV
            git log origin/main..HEAD --oneline --pretty=format:"- %s (%h)" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
  
        - name: Create PR dev -> main
          run: |
            gh pr create \
              --title "merge: ${{ github.ref_name }} -> main" \
              --body "$COMMITS_LIST" \
              --base main \
              --head dev || echo "PR already exists or could not be created"
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

